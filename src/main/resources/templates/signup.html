<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Elements */
        .blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            filter: blur(80px);
            border-radius: 50%;
            z-index: 0;
            animation: float 20s infinite ease-in-out;
        }

        .blob:nth-child(1) {
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .blob:nth-child(2) {
            bottom: -100px;
            right: -100px;
            animation-delay: 5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        .signup-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3), 0 0 100px rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .signup-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35), 0 0 120px rgba(102, 126, 234, 0.3);
        }

        .signup-title {
            text-align: center;
            margin-bottom: 0.5rem;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: -0.5px;
            font-size: 1.8rem;
        }

        .signup-subtitle {
            text-align: center;
            color: #64748b;
            font-weight: 400;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .signup-title i {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-right: 0.5rem;
            display: block;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .form-label {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .form-label span {
            color: #ef4444;
            font-size: 1rem;
        }

        .form-control {
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 0.85rem 1rem;
            background: #f8fafc;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #1e293b;
        }

        .form-control::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .form-control:focus {
            background: white;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            color: #1e293b;
        }

        .input-group {
            gap: 0;
        }

        .input-group .form-control {
            border-radius: 12px 0 0 12px;
            border-right: none;
        }

        .input-group-text {
            border-radius: 0 12px 12px 0;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-left: none;
            color: #64748b;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .input-group:focus-within .input-group-text {
            border-color: var(--primary);
            background: white;
            color: var(--primary);
        }

        .input-group:focus-within .form-control {
            border-color: var(--primary);
        }

        .alert-danger {
            border-radius: 12px;
            font-size: 0.9rem;
            border: 1px solid #fecaca;
            background-color: #fee2e2;
            color: #991b1b;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.875rem 1rem;
        }

        .alert-danger i {
            font-size: 1.1rem;
        }

        .btn-custom {
            background: var(--gradient);
            color: white;
            width: 100%;
            border-radius: 12px;
            padding: 0.9rem;
            font-weight: 700;
            border: none;
            margin-top: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
            letter-spacing: 0.5px;
            cursor: pointer;
        }

        .btn-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
            color: white;
        }

        .btn-custom:active {
            transform: translateY(-1px);
        }

        .login-link-container {
            text-align: center;
            margin-top: 1.75rem;
            padding-top: 1.75rem;
            border-top: 1px solid #e2e8f0;
        }

        .login-link-container span {
            color: #64748b;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .login-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            margin-left: 0.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .login-link:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        /* INPUT ICONS */
        .mb-3 {
            margin-bottom: 1.25rem !important;
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .signup-card {
                padding: 1.75rem;
                width: calc(100% - 20px);
            }

            .signup-title {
                font-size: 1.5rem;
            }

            .btn-custom {
                padding: 0.8rem;
                font-size: 0.95rem;
            }
        }

    </style>

</head>

<body>

<div class="blob"></div>
<div class="blob"></div>

<div class="signup-card">

    <h2 class="signup-title">
        <i class="bi bi-person-plus-fill"></i>
        Create Account
    </h2>

    <p class="signup-subtitle">Join us and get started today</p>

    <!-- Error -->
    <div th:if="${error}" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${error}"></span>
    </div>

    <form action="/register"
          method="post"
          th:object="${user}">

        <!-- Name -->
        <div class="mb-3">
            <label class="form-label">
                <i class="bi bi-person-fill"></i>
                Full Name
                <span>*</span>
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{name}"
                   placeholder="John Doe"
                   required>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label class="form-label">
                <i class="bi bi-envelope-fill"></i>
                Email
                <span>*</span>
            </label>

            <input type="email"
                   class="form-control"
                   th:field="*{email}"
                   placeholder="you@company.com"
                   required>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label class="form-label">
                <i class="bi bi-lock-fill"></i>
                Password
                <span>*</span>
            </label>

            <div class="input-group">
                <input type="password"
                       id="signupPassword"
                       class="form-control"
                       th:field="*{password}"
                       placeholder="••••••••"
                       required>

                <span class="input-group-text"
                      onclick="togglePassword()"
                      style="cursor:pointer;">
                    <i id="toggleIcon" class="bi bi-eye"></i>
                </span>
            </div>
        </div>

        <button type="submit" class="btn btn-custom">
            <i class="bi bi-check-circle"></i>
            Create Account
        </button>

    </form>

    <div class="login-link-container">
        <span>Already have an account?</span>
        <a href="/login" class="login-link">Login here</a>
    </div>

</div>

<script>

    function togglePassword(){
        let password = document.getElementById("signupPassword");
        let toggleIcon = document.getElementById("toggleIcon");

        if(password.type === "password"){
            password.type = "text";
            toggleIcon.classList.remove("bi-eye");
            toggleIcon.classList.add("bi-eye-slash");
        }else{
            password.type = "password";
            toggleIcon.classList.remove("bi-eye-slash");
            toggleIcon.classList.add("bi-eye");
        }
    }

</script>

</body>

</html>
