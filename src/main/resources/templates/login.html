<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Secure Access</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            background: var(--bg-gradient);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        /* Animated Background Blobs */
        .blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary-color);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.4;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-50%, -50%); }
            to { transform: translate(50%, 50%); }
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--glass-bg);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .login-title {
            text-align: center;
            margin-bottom: 2rem;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: -0.5px;
        }

        .login-title i {
            color: var(--primary-color);
            display: block;
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .form-label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #475569;
        }

        .form-control {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .input-group-text {
            border-radius: 0 12px 12px 0;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: none;
            color: #64748b;
            transition: all 0.2s ease;
        }

        .btn-custom {
            background: var(--primary-color);
            color: white;
            width: 100%;
            border-radius: 12px;
            padding: 0.8rem;
            font-weight: 600;
            border: none;
            margin-top: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.3);
        }

        .btn-custom:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
            color: white;
        }

        .alert-danger {
            border-radius: 12px;
            font-size: 0.85rem;
            border: none;
            background-color: #fee2e2;
            color: #991b1b;
        }

        .signup-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link:hover {
            text-decoration: underline;
        }

        /* Custom focus for input group */
        .input-group:focus-within .form-control {
            border-color: var(--primary-color);
        }
        .input-group:focus-within .input-group-text {
            border-color: var(--primary-color);
        }
    </style>
</head>

<body>

<div class="blob"></div>

<div class="login-card">
    <div class="login-title">
        <i class="bi bi-shield-lock-fill"></i>
        <h2>Welcome Back</h2>
        <p class="text-muted fw-normal fs-6">Please enter your details</p>
    </div>

    <!-- Error Message -->
    <div th:if="${error}" class="alert alert-danger d-flex align-items-center" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${error}">Invalid credentials</span>
    </div>

    <form action="/authenticate" method="post">
        <!-- Email -->
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" 
                   name="email" 
                   class="form-control" 
                   placeholder="name@company.com" 
                   required>
        </div>

        <!-- Password -->
        <div class="mb-4">
            <label class="form-label">Password</label>
            <div class="input-group">
                <input type="password" 
                       id="loginPassword" 
                       name="password" 
                       class="form-control" 
                       placeholder="••••••••" 
                       required>
                <span class="input-group-text" onclick="togglePassword()" style="cursor:pointer;">
                    <i id="toggleIcon" class="bi bi-eye"></i>
                </span>
            </div>
        </div>

        <button type="submit" class="btn btn-custom">
            Sign In
        </button>
    </form>

    <div class="text-center mt-4">
        <span class="text-muted small">Don't have an account?</span>
        <a href="/signup" class="signup-link small ms-1">Create Account</a>
    </div>
</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById("loginPassword");
        const toggleIcon = document.getElementById("toggleIcon");
        
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleIcon.classList.replace("bi-eye", "bi-eye-slash");
        } else {
            passwordInput.type = "password";
            toggleIcon.classList.replace("bi-eye-slash", "bi-eye");
        }
    }
</script>

</body>
</html>
