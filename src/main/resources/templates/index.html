<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Dashboard</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <style>

        body{
            background: #f4f7fc;
            font-family: 'Poppins', sans-serif;
        }

        .navbar{
            background: #141e30;
        }

        .navbar-brand{
            font-weight: 600;
            color: white !important;
        }

        .logout-btn{
            border-radius: 10px;
        }

        .main-container{
            max-width: 1200px;
            margin: auto;
            margin-top: 40px;
        }

        .dashboard-title{
            font-weight: 600;
            margin-bottom: 25px;
            color: #141e30;
        }

        .note-form{
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.1);
        }

        .note-card{
            border: none;
            border-radius: 20px;
            transition: 0.3s;
            box-shadow: 0px 3px 15px rgba(0,0,0,0.1);
        }

        .note-card:hover{
            transform: translateY(-5px);
        }

        .btn-custom{
            background: #0d6efd;
            color: white;
            border-radius: 10px;
            padding: 10px 20px;
        }

        .btn-custom:hover{
            background: #0b5ed7;
            color: white;
        }

        textarea{
            resize: none;
        }

        .empty-notes{
            text-align: center;
            margin-top: 50px;
            color: gray;
        }

    </style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

    <div class="container-fluid px-4">

        <a class="navbar-brand"
           href="/dashboard">

            📝 Notes Dashboard

        </a>

        <a href="/logout"
           class="btn btn-danger logout-btn">

            <i class="bi bi-box-arrow-right"></i>
            Logout

        </a>

    </div>

</nav>

<div class="container main-container">

    <!-- TITLE -->

    <h2 class="dashboard-title">

        Welcome to Your Dashboard 🚀

    </h2>

    <!-- SEARCH BAR -->

    <div class="note-form mb-4">

        <form action="/search"
              method="get">

            <div class="input-group">

                <input type="text"
                       name="keyword"
                       class="form-control"
                       placeholder="Search notes by title...">

                <button type="submit"
                        class="btn btn-dark">

                    <i class="bi bi-search"></i>
                    Search

                </button>

            </div>

        </form>

    </div>

    <!-- NOTE FORM -->

    <div class="note-form mb-5">

        <h4 class="mb-4">

            <i class="bi bi-journal-plus"></i>
            Add / Edit Note

        </h4>

        <form action="/save"
              method="post"
              th:object="${note}">

            <!-- Hidden ID -->

            <input type="hidden"
                   th:field="*{id}">

            <!-- Title -->

            <div class="mb-3">

                <label class="form-label">
                    Note Title
                    <span style="color:red">*</span>
                </label>

                <input type="text"
                       class="form-control"
                       th:field="*{title}"
                       placeholder="Enter note title"
                       required>

            </div>

            <!-- Content -->

            <div class="mb-3">

                <label class="form-label">
                    Note Content
                </label>

                <textarea class="form-control"
                          th:field="*{content}"
                          rows="5"
                          placeholder="Write your note here...">
                </textarea>

            </div>

            <!-- Save -->

            <button type="submit"
                    class="btn btn-custom">

                <i class="bi bi-save"></i>
                Save Note

            </button>

        </form>

    </div>

    <!-- NOTES -->

    <div class="row">

        <div class="col-md-4 mb-4"
             th:each="n : ${notes}">

            <div class="card note-card h-100">

                <div class="card-body d-flex flex-column">

                    <h4 class="card-title"
                        th:text="${n.title}">
                    </h4>

                    <p class="card-text flex-grow-1"
                       th:text="${n.content}">
                    </p>

                    <div class="mt-3">

                        <!-- Edit -->

                        <a th:href="@{'/edit/' + ${n.id}}"
                           class="btn btn-warning btn-sm">

                            <i class="bi bi-pencil-square"></i>
                            Edit

                        </a>

                        <!-- Delete -->

                        <a th:href="@{'/delete/' + ${n.id}}"
                           class="btn btn-danger btn-sm ms-2"
                           onclick="return confirm('Are you sure you want to delete this note?')">

                            <i class="bi bi-trash"></i>
                            Delete

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- EMPTY NOTES -->

    <div th:if="${#lists.isEmpty(notes)}"
         class="empty-notes">

        <h4>

            <i class="bi bi-journal-x"></i>

            No notes found

        </h4>

    </div>

</div>

</body>

</html>
