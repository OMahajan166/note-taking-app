<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1e293b;
            --light-bg: #f8fafc;
            --card-shadow: 0 10px 30px rgba(99, 102, 241, 0.1);
            --card-shadow-hover: 0 20px 40px rgba(99, 102, 241, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            padding: 1rem 0;
        }

        .navbar-brand {
            font-weight: 700;
            color: white !important;
            font-size: 1.3rem;
            letter-spacing: -0.5px;
        }

        .logout-btn {
            border-radius: 10px;
            font-weight: 600;
            padding: 0.5rem 1rem;
            background: #ef4444;
            border: none;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
        }

        /* MAIN CONTAINER */
        .main-container {
            max-width: 1200px;
            margin: auto;
            margin-top: 40px;
            padding: 0 20px;
        }

        /* TITLE */
        .dashboard-title {
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--dark);
            font-size: 2rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* SEARCH FORM */
        .note-form {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            border: 1px solid rgba(99, 102, 241, 0.1);
        }

        .note-form:hover {
            box-shadow: var(--card-shadow-hover);
        }

        .note-form h4 {
            color: var(--dark);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* INPUT STYLING */
        .form-control {
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            background: #f8fafc;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: white;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            color: var(--dark);
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        textarea.form-control {
            resize: none;
            font-family: 'Poppins', sans-serif;
        }

        .form-label {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
        }

        /* SEARCH INPUT GROUP */
        .input-group {
            gap: 0;
        }

        .input-group .form-control {
            border-radius: 12px 0 0 12px;
        }

        .input-group .btn {
            border-radius: 0 12px 12px 0;
            font-weight: 600;
            transition: all 0.3s ease;
            background: var(--dark);
            border: 1.5px solid var(--dark);
        }

        .input-group .btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        /* BUTTONS */
        .btn-custom {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border-radius: 12px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
            color: white;
        }

        .btn-custom:active {
            transform: translateY(0);
        }

        /* NOTE CARD */
        .note-card {
            border: 1px solid rgba(99, 102, 241, 0.1);
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--card-shadow);
            overflow: hidden;
            background: white;
        }

        .note-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--card-shadow-hover);
            border-color: var(--primary);
        }

        .note-card .card-body {
            padding: 1.5rem;
        }

        .note-card .card-title {
            color: var(--dark);
            font-weight: 700;
            margin-bottom: 1rem;
            font-size: 1.1rem;
            word-break: break-word;
        }

        .note-card .card-text {
            color: #64748b;
            font-size: 0.95rem;
            line-height: 1.6;
            word-break: break-word;
            max-height: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* CARD BUTTONS */
        .note-card .btn-warning {
            background: linear-gradient(135deg, var(--warning) 0%, #d97706 100%);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .note-card .btn-warning:hover {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4);
            color: white;
        }

        .note-card .btn-danger {
            background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .note-card .btn-danger:hover {
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
            color: white;
        }

        /* EMPTY STATE */
        .empty-notes {
            text-align: center;
            margin-top: 60px;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(99, 102, 241, 0.1);
        }

        .empty-notes h4 {
            color: var(--dark);
            font-weight: 700;
            margin-top: 1rem;
        }

        .empty-notes i {
            font-size: 3rem;
            color: var(--primary);
            opacity: 0.3;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .dashboard-title {
                font-size: 1.5rem;
            }

            .note-form {
                padding: 1.5rem;
            }

            .main-container {
                margin-top: 20px;
            }
        }

    </style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">

    <div class="container-fluid px-4">

        <a class="navbar-brand" href="/dashboard">
            📝 Notes Dashboard
        </a>

        <a href="/logout" class="btn btn-danger logout-btn">
            <i class="bi bi-box-arrow-right"></i>
            Logout
        </a>

    </div>

</nav>

<div class="container main-container">

    <!-- TITLE -->
    <h2 class="dashboard-title">
        Welcome to Your Dashboard 🚀
    </h2>

    <!-- SEARCH BAR -->
    <div class="note-form mb-4">

        <form action="/search" method="get">

            <div class="input-group">

                <input type="text"
                       name="keyword"
                       class="form-control"
                       placeholder="Search notes by title...">

                <button type="submit" class="btn btn-dark">
                    <i class="bi bi-search"></i>
                    Search
                </button>

            </div>

        </form>

    </div>

    <!-- NOTE FORM -->
    <div class="note-form mb-5">

        <h4 class="mb-4">
            <i class="bi bi-journal-plus"></i>
            Add / Edit Note
        </h4>

        <form action="/save" method="post" th:object="${note}">

            <!-- Hidden ID -->
            <input type="hidden" th:field="*{id}">

            <!-- Title -->
            <div class="mb-3">

                <label class="form-label">
                    Note Title <span style="color:red">*</span>
                </label>

                <input type="text"
                       class="form-control"
                       th:field="*{title}"
                       placeholder="Enter note title"
                       required>

            </div>

            <!-- Content -->
            <div class="mb-3">

                <label class="form-label">
                    Note Content
                </label>

                <textarea class="form-control"
                          th:field="*{content}"
                          rows="5"
                          placeholder="Write your note here...">
                </textarea>

            </div>

            <!-- Save -->
            <button type="submit" class="btn btn-custom">
                <i class="bi bi-save"></i>
                Save Note
            </button>

        </form>

    </div>

    <!-- NOTES -->
    <div class="row">

        <div class="col-md-4 mb-4" th:each="n : ${notes}">

            <div class="card note-card h-100">

                <div class="card-body d-flex flex-column">

                    <h4 class="card-title" th:text="${n.title}"></h4>

                    <p class="card-text flex-grow-1" th:text="${n.content}"></p>

                    <div class="mt-3 d-flex gap-2">

                        <!-- Edit -->
                        <a th:href="@{'/edit/' + ${n.id}}"
                           class="btn btn-warning btn-sm">
                            <i class="bi bi-pencil-square"></i>
                            Edit
                        </a>

                        <!-- Delete -->
                        <a th:href="@{'/delete/' + ${n.id}}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this note?')">
                            <i class="bi bi-trash"></i>
                            Delete
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- EMPTY NOTES -->
    <div th:if="${#lists.isEmpty(notes)}" class="empty-notes">

        <i class="bi bi-journal-x"></i>

        <h4>
            No notes found
        </h4>

        <p class="text-muted mt-2">Create your first note to get started!</p>

    </div>

</div>

</body>

</html>
